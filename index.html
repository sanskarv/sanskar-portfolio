<style>
  :root{
    --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
    --accent:#5b7cfa;
    --glass: rgba(255,255,255,.72);
    --glass-dark: rgba(30,32,40,.55);
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0; overflow:hidden; font-family:var(--ui); color:#1a1a1a;}
  button{font-family:var(--ui); cursor:pointer; border:none; background:none;}
  a{color:var(--accent); text-decoration:none;}
  a:hover{text-decoration:underline;}

  /* ===== DESKTOP / WALLPAPER ===== */
  .desktop{
    position:fixed; inset:0; top:30px; bottom:0; overflow:hidden;
    background:
      radial-gradient(1200px 800px at 78% 15%, rgba(255,255,255,.10), transparent 55%),
      linear-gradient(128deg, #0a0f3d 0%, #1f2f9e 28%, #4a4fd6 50%, #6f6ef0 66%, #9f8ff5 82%, #cfc4fa 100%);
  }
  .desktop::before{
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(700px 500px at 15% 85%, rgba(10,15,60,.55), transparent 60%),
      radial-gradient(900px 600px at 95% 90%, rgba(20,15,90,.35), transparent 55%);
  }
  .hero{
    position:absolute; left:50%; top:38%; transform:translate(-50%,-50%);
    text-align:center; color:#fff; pointer-events:none; width:90%; max-width:620px;
  }
  .hero .lead{font-size:clamp(15px,2vw,19px); font-weight:500; opacity:.92; text-shadow:0 1px 6px rgba(0,0,0,.35);}
  .hero .big{
    font-family:'Comic Sans MS', 'Segoe Print', var(--ui); font-weight:700;
    font-size:clamp(48px,9vw,88px); line-height:1; margin-top:6px; letter-spacing:.01em;
    text-shadow:0 3px 18px rgba(0,0,0,.35); transform:rotate(-1.5deg);
  }

  /* ===== MENU BAR ===== */
  .menubar{
    position:fixed; top:0; left:0; right:0; height:30px; z-index:600;
    background:var(--glass-dark); backdrop-filter:blur(16px);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 14px; color:#f2f2f2; font-size:12.5px;
  }
  .mb-left{display:flex; align-items:center; gap:18px;}
  .mb-logo{
    width:16px; height:16px; border-radius:50%; background:var(--accent);
    display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:#fff;
  }
  .mb-name{font-weight:600;}
  .mb-links{display:flex; gap:16px;}
  .mb-links button{color:#e8e8e8; font-size:12.5px; opacity:.85;}
  .mb-links button:hover{opacity:1;}
  .mb-right{display:flex; align-items:center; gap:14px; font-size:12px; opacity:.9;}

  /* ===== DESKTOP ICONS ===== */
  .icons{position:absolute; top:22px; left:20px; display:grid; grid-auto-flow:column; grid-template-rows:repeat(4,150px); gap:6px 14px;}
  .dicon{
    width:130px; height:144px; display:flex; flex-direction:column; align-items:center; gap:8px;
    padding:8px; border-radius:10px; color:#fff;
  }
  .dicon:hover, .dicon:focus-visible{background:rgba(255,255,255,.14);}
  .dicon svg{width:68px; height:68px;}
  .dicon span{font-size:13.5px; text-align:center; text-shadow:0 1px 3px rgba(0,0,0,.6); line-height:1.25; max-width:126px;}

  /* ===== DOCK ===== */
  .dock-wrap{position:fixed; left:0; right:0; bottom:10px; z-index:700; display:flex; justify-content:center; pointer-events:none;}
  .dock{
    pointer-events:auto; display:flex; align-items:flex-end; gap:10px;
    background:var(--glass-dark); backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.12); border-radius:20px; padding:8px 10px;
  }
  .dock-item{position:relative; display:flex; flex-direction:column; align-items:center;}
  .dock-btn{
    width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    transition:transform .15s ease; background:rgba(255,255,255,.08);
  }
  .dock-btn:hover{transform:translateY(-6px) scale(1.08);}
  .dock-btn svg{width:26px; height:26px;}
  .dock-tip{
    position:absolute; bottom:56px; background:#222; color:#fff; font-size:11px; padding:3px 8px;
    border-radius:5px; white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .15s;
  }
  .dock-item:hover .dock-tip{opacity:1;}
  .dock-sep{width:1px; align-self:stretch; background:rgba(255,255,255,.18); margin:4px 2px;}
  .askme{
    position:relative; display:flex; align-items:center; gap:6px; padding:0 14px; height:46px; border-radius:23px;
    background:linear-gradient(135deg, var(--accent), #8b6ef7); color:#fff; font-size:13px; font-weight:600;
    transition:transform .15s ease;
  }
  .askme:hover{transform:translateY(-6px) scale(1.05);}
  .askme .badge{
    position:absolute; top:-4px; right:6px; background:#ff5f57; color:#fff; font-size:9px; font-weight:700;
    width:15px; height:15px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  }

  /* ===== WINDOWS ===== */
  #windows-layer{position:absolute; inset:0; z-index:100; pointer-events:none;}
  .win{
    position:absolute; display:flex; flex-direction:column; min-width:280px; min-height:200px;
    background:#fbfbfd; border-radius:12px; overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.06);
    pointer-events:auto;
  }
  .win.maximized{ left:2% !important; top:2% !important; width:96% !important; height:94% !important; }
  .titlebar{
    height:38px; flex:0 0 auto; display:flex; align-items:center; padding:0 12px;
    background:linear-gradient(180deg, #f6f6f8, #ececef); border-bottom:1px solid #e0e0e3;
    touch-action:none; user-select:none; position:relative;
  }
  .tl{display:flex; gap:8px;}
  .tl button{width:12px; height:12px; border-radius:50%; padding:0;}
  .tl .r{background:#ff5f57;} .tl .y{background:#febc2e;} .tl .g{background:#28c840;}
  .titlebar .ttl{
    position:absolute; left:50%; transform:translateX(-50%); font-size:12.5px; font-weight:600; color:#444;
  }
  .win-body{flex:1; overflow:auto; background:#fff;}
  .content{padding:22px 26px; line-height:1.6; color:#1c1c1e;}
  .content h2{font-size:19px; margin-bottom:4px;}
  .content .role{font-size:12px; color:var(--accent); font-weight:600; margin-bottom:12px; text-transform:uppercase; letter-spacing:.03em;}
  .kv{display:grid; grid-template-columns:110px 1fr; gap:8px 10px; margin:12px 0; font-size:13px;}
  .kv b{font-weight:600; color:#555;}
  .stack{display:flex; flex-wrap:wrap; gap:6px; margin:12px 0;}
  .stack span{font-family:var(--mono); font-size:11px; padding:3px 9px; background:#f0f1f6; border-radius:6px; color:#333;}
  .content ul{margin:12px 0 4px 20px;}
  .content li{margin-bottom:9px; font-size:13.5px;}
  .badges{display:flex; flex-wrap:wrap; gap:6px; margin:12px 0;}
  .badges span{font-size:11px; padding:4px 9px; background:#fff3d6; border-radius:6px; color:#7a5b00;}
  .doi{font-family:var(--mono); font-size:11.5px; color:#777; margin-top:10px; display:block;}
  table.inv{border-collapse:collapse; width:100%; font-size:13px;}
  table.inv td, table.inv th{border-bottom:1px solid #eee; padding:9px 4px; text-align:left;}
  table.inv th{color:#888; font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.03em;}
  .hint{font-size:12px; color:#888; margin-top:16px; padding-top:14px; border-top:1px solid #eee;}

  .pgrid{display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:20px 24px;}
  .pcard{border:1px solid #ececef; border-radius:10px; padding:16px;}
  .pcard h3{font-size:14.5px; margin-bottom:6px;}
  .pcard p{font-size:12.5px; color:#555; margin-bottom:8px;}
  @media (max-width:600px){.pgrid{grid-template-columns:1fr;}}

  /* ===== CHAT WINDOW ===== */
  .chat-log{display:flex; flex-direction:column; gap:10px; padding:16px; min-height:100%;}
  .bubble{max-width:80%; padding:9px 13px; border-radius:14px; font-size:13.5px; line-height:1.5;}
  .bubble.bot{background:#eef0f6; color:#1c1c1e; align-self:flex-start; border-bottom-left-radius:4px;}
  .bubble.user{background:var(--accent); color:#fff; align-self:flex-end; border-bottom-right-radius:4px;}
  .typing{display:flex; gap:4px; align-self:flex-start; padding:10px 14px; background:#eef0f6; border-radius:14px; border-bottom-left-radius:4px;}
  .typing span{width:6px; height:6px; border-radius:50%; background:#999; animation:blink 1.2s infinite ease-in-out;}
  .typing span:nth-child(2){animation-delay:.2s;} .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.3;} 40%{opacity:1;}}
  .chat-body{display:flex; flex-direction:column; height:100%;}
  .chat-scroll{flex:1; overflow:auto;}
  .chat-input-row{display:flex; gap:8px; padding:10px; border-top:1px solid #eee; background:#fafafa;}
  .chat-input-row input{
    flex:1; border:1px solid #ddd; border-radius:18px; padding:9px 14px; font-size:13.5px; font-family:var(--ui);
    outline:none;
  }
  .chat-input-row input:focus{border-color:var(--accent);}
  .chat-input-row button{
    background:var(--accent); color:#fff; width:36px; height:36px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  }

  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  @media (max-width:720px){
    .icons{grid-template-rows:repeat(6,118px); left:10px; gap:4px 8px;}
    .dicon{width:100px; height:112px;}
    .dicon svg{width:52px; height:52px;}
    .dicon span{font-size:12px; max-width:96px;}
    .win{left:3% !important; top:6% !important; width:94% !important; height:82% !important;}
    .mb-links{display:none;}
    .pgrid{grid-template-columns:1fr;}
  }
  @media (prefers-reduced-motion: reduce){
    .dock-btn, .askme{transition:none;}
    .typing span{animation:none; opacity:.6;}
  }
</style>
</head>

      el.querySelector('[data-act="min"]').addEventListener('click', function(){ el.style.display='none'; });
      el.querySelector('[data-act="max"]').addEventListener('click', function(){ el.classList.toggle('maximized'); });
      el.addEventListener('mousedown', function(){ bringToFront(el); });

    el.style.display = 'flex';

  function bringToFront(el){ zTop += 1; el.style.zIndex = zTop; }

  function makeDraggable(el){
    var titlebar = el.querySelector('.titlebar');
    var offX=0, offY=0, dragging=false;
    titlebar.addEventListener('pointerdown', function(e){
      if(e.target.closest('.tl')) return;
      if(el.classList.contains('maximized')) return;
      dragging = true;
      var rect = el.getBoundingClientRect();
      offX = e.clientX - rect.left; offY = e.clientY - rect.top;
      titlebar.setPointerCapture(e.pointerId);
    });
    titlebar.addEventListener('pointermove', function(e){
      if(!dragging) return;
      var deskRect = document.getElementById('desktop').getBoundingClientRect();
      var nx = e.clientX - offX - deskRect.left;
      var ny = e.clientY - offY - deskRect.top;
      nx = Math.max(-el.offsetWidth+80, Math.min(nx, deskRect.width-40));
      ny = Math.max(0, Math.min(ny, deskRect.height-30));
      el.style.left = nx+'px'; el.style.top = ny+'px';
    });
    titlebar.addEventListener('pointerup', function(e){ dragging=false; try{titlebar.releasePointerCapture(e.pointerId);}catch(err){} });
    titlebar.addEventListener('pointercancel', function(){ dragging=false; });
  }

  function initChat(winEl){
